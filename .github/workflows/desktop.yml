# Freeze the double-clickable application, one artefact per platform — and on a tag,
# publish them as a GitHub Release. Two ways in, same build:
#
#   Rehearse   Actions ▸ "Build desktop apps" ▸ Run workflow. Pick a branch and which
#              platforms; the archives appear under the run's **Artifacts**, where they
#              can be downloaded and tried out. No release is created.
#   Release    `git tag v0.1.1 && git push origin v0.1.1`. Every platform is built, and
#              the `release` job attaches the archives plus the wheel to a new Release.
#
# Nothing else triggers this: no push to a branch, no pull request, no schedule.
#
# Each job installs napari and the plugin, runs PyInstaller over
# app/MultiplexThresholder.spec, then **launches the frozen app with `--self-test`** —
# the build is only useful if the bundle actually starts, and a freeze fails silently in
# ways a wheel never does (missing Qt plugins, missing compiled TIFF decoders, an empty
# Plugins menu). A job that cannot self-test fails, and a failed job blocks the release.
#
# Artefacts are ~700 MB-1.2 GB each, so the download is one platform at a time:
#
#   MultiplexThresholder-<version>-macos-arm64.zip     Multiplex Thresholder.app
#   MultiplexThresholder-<version>-macos-x86_64.zip    Multiplex Thresholder.app
#   MultiplexThresholder-<version>-windows-x64.zip     Multiplex Thresholder.exe + libs
#   MultiplexThresholder-<version>-linux-x64.tar.gz    Multiplex Thresholder + libs
#
# Neither the app nor the installer is code-signed: macOS needs one right-click ▸ Open,
# Windows one "More info ▸ Run anyway". Signing needs a paid certificate per platform;
# see the README.
name: Build desktop apps

run-name: >-
  ${{ github.ref_type == 'tag' && 'Release' || 'Desktop apps from' }}
  ${{ github.ref_name }} (${{ inputs.platforms || 'all' }})

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to freeze"
        type: choice
        default: all
        options:
          - all
          - macos-arm64      # Apple Silicon
          - macos-x86_64     # Intel Macs
          - windows-x64
          - linux-x64
  # A tag is the release trigger: the same jobs run, and the `release` job at the bottom
  # then publishes what they produced. Nothing else starts this workflow.
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  matrix:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.plan.outputs.json }}
    steps:
      - id: plan
        env:
          WANTED: ${{ inputs.platforms }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          # Runner images. macos-latest is Apple Silicon. For Intel it must be
          # `macos-15-intel`: macos-13 was the old Intel image and has been fully
          # unsupported since 4 December 2025, and a retired label does not error — the
          # job simply queues for a runner that will never come, until GitHub cancels it.
          # macos-15-intel is the last x86_64 image and goes away in August 2027; after
          # that, drop this target rather than looking for a replacement.
          targets = {
              "macos-arm64":  {"target": "macos-arm64",  "os": "macos-latest",    "archive": "zip"},
              "macos-x86_64": {"target": "macos-x86_64", "os": "macos-15-intel",  "archive": "zip"},
              "windows-x64":  {"target": "windows-x64",  "os": "windows-latest",  "archive": "zip"},
              "linux-x64":    {"target": "linux-x64",    "os": "ubuntu-latest",   "archive": "tar"},
          }
          wanted = os.environ.get("WANTED") or "all"
          chosen = list(targets.values()) if wanted == "all" else [targets[wanted]]
          print("json=" + json.dumps(chosen))
          PY

  freeze:
    name: ${{ matrix.target }}
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.json) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # napari[all] + PyInstaller is a ~2.5 minute download on a cold runner.
          cache: pip
          cache-dependency-path: pyproject.toml

      # Qt6 needs its X libraries even to start offscreen, and the self-test needs a
      # GL-capable display, which on a runner means xvfb with software mesa.
      - name: Linux — Qt and OpenGL runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libopengl0 libglx-mesa0 libgl1-mesa-dri libglib2.0-0 \
            libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0 libxrender1 libfontconfig1

      - name: Install napari, the plugin and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[bundle]"
          python -c "import napari, PyInstaller; print('napari', napari.__version__, '| pyinstaller', PyInstaller.__version__)"

      - id: version
        run: echo "value=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Freeze
        run: python -m PyInstaller app/MultiplexThresholder.spec --noconfirm --distpath dist --workpath build

      # A windows-latest runner has no GPU driver: the system opengl32.dll is a stub, so
      # PyOpenGL resolves its entry points to NULL and vispy dies with
      # "TypeError: 'NoneType' object is not callable" the moment napari asks for a
      # canvas. Qt ships llvmpipe as opengl32sw.dll; dropped into the app's own folder
      # under the name Windows resolves from the executable's directory first, both Qt
      # and PyOpenGL can load the same software GL.
      #
      # "Can", not "will": Qt judges desktop GL inadequate and falls back to loading its
      # *own* opengl32sw.dll, so the two ended up with separate llvmpipe instances — the
      # context in Qt's, the query in PyOpenGL's, and GL_INVALID_OPERATION (1282) out of
      # glGetIntegerv. QT_OPENGL=desktop in the test step forbids that fallback so both
      # resolve the same module. If it still does not take, the viewer check reports a
      # skip rather than failing the job (see below).
      #
      # The DLL is deliberately *not* part of the bundle: shipping it would force every
      # user onto software rendering. Copied in for the test, deleted right after, and the
      # Package step refuses to archive a folder that still contains it.
      - name: Windows — software OpenGL for the test only
        if: runner.os == 'Windows'
        run: |
          # In Python, not `find`: Git Bash on Windows and native Windows paths do not
          # mix, and the DLL sits in a different place depending on the Qt wheel.
          python - <<'PY'
          import shutil, sysconfig
          from pathlib import Path

          app = Path("dist/Multiplex Thresholder")
          roots = [app, Path(sysconfig.get_paths()["purelib"])]
          src = next((p for root in roots if root.is_dir() for p in root.rglob("opengl32sw.dll")), None)
          if src is None:
              print("::warning::opengl32sw.dll not found — the viewer check will report a skip")
          else:
              shutil.copy2(src, app / "opengl32.dll")
              print(f"software GL from {src}")
          PY

      # The point of the whole job: run what was just built. The bundle checks — compiled
      # TIFF decoders, npe2 discovery, matplotlib's Qt backend — are always fatal, on
      # every platform. The viewer check needs a live GL context, so who has to have one
      # is a per-platform decision:
      #
      #   macOS   a real context, no display needed  -> --require-gui
      #   Linux   xvfb with mesa is reliable         -> --require-gui
      #   Windows software GL on a driverless runner is best-effort, so a context that
      #           never materialises is reported as a skip. This is a limitation of the
      #           runner, not of the app; the same bundle opens on a real Windows
      #           machine. Verify a release candidate there with --smoke.
      #
      # Timed out deliberately short: a frozen GUI app that wedges should fail in five
      # minutes, not sit until the job's 90.
      - name: Launch the frozen app and self-test it
        timeout-minutes: 5
        env:
          # Belt and braces — GitHub sets CI=true, and either one stops the crash
          # reporter from opening a modal dialog nobody can dismiss.
          MULTIPLEX_THRESHOLDER_NO_DIALOG: "1"
        run: |
          case "$RUNNER_OS" in
            macOS)
              "dist/Multiplex Thresholder.app/Contents/MacOS/Multiplex Thresholder" \
                --self-test --require-gui ;;
            Windows)
              # QT_OPENGL=desktop: use the opengl32.dll copied in above rather than Qt's
              # own opengl32sw.dll, so Qt's context and PyOpenGL's queries are the same
              # library. Not asserted — see the note above.
              QT_OPENGL=desktop \
                "dist/Multiplex Thresholder/Multiplex Thresholder.exe" --self-test
              rm -f "dist/Multiplex Thresholder/opengl32.dll" ;;
            Linux)
              # A GLX-capable screen, explicitly: xvfb's default visual has caught vispy
              # out before.
              xvfb-run -a --server-args="-screen 0 1280x1024x24 +extension GLX +render" \
                "dist/Multiplex Thresholder/Multiplex Thresholder" --self-test --require-gui ;;
          esac

      # `ditto`, not `zip`: the .app contains symlinked Qt frameworks and an ad-hoc code
      # signature, and `zip -r` flattens the first and invalidates the second, which
      # makes macOS refuse the app as damaged.
      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.value }}
          TARGET: ${{ matrix.target }}
        run: |
          name="MultiplexThresholder-${VERSION}-${TARGET}"
          # The software-GL shim is a test fixture. If it is still here, the test step
          # did not clean up and users would be shipped llvmpipe instead of their GPU.
          if [ -f "dist/Multiplex Thresholder/opengl32.dll" ]; then
            echo "::error::opengl32.dll (software GL test shim) is still in the app folder"
            exit 1
          fi
          case "$RUNNER_OS" in
            macOS)
              ditto -c -k --sequesterRsrc --keepParent "dist/Multiplex Thresholder.app" "${name}.zip"
              echo "file=${name}.zip" >> "$GITHUB_OUTPUT" ;;
            Windows)
              7z a -tzip -mx=5 "${name}.zip" "dist/Multiplex Thresholder" >/dev/null
              echo "file=${name}.zip" >> "$GITHUB_OUTPUT" ;;
            Linux)
              tar czf "${name}.tar.gz" -C dist "Multiplex Thresholder"
              echo "file=${name}.tar.gz" >> "$GITHUB_OUTPUT" ;;
          esac
          ls -lh "${name}."* | cat

      - uses: actions/upload-artifact@v4
        with:
          name: MultiplexThresholder-${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
          compression-level: 0    # the archive is already compressed

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.value }}
          TARGET: ${{ matrix.target }}
          FILE: ${{ steps.package.outputs.file }}
        run: |
          size=$(du -h "$FILE" | cut -f1)
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          **$TARGET** — \`$FILE\` ($size), self-test passed.
          EOF

  # Only on a tag, and only if every platform built and self-tested. A dispatched run
  # stops above, with the archives on the run for download.
  release:
    name: Release (tags only)
    if: github.ref_type == 'tag'
    needs: freeze
    runs-on: ubuntu-latest
    permissions:
      contents: write     # the only job that needs to write to the repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The tag names the release, so it must agree with what the package will report as
      # its version. Cheaper to fail here than to explain a v0.2.0 release that installs
      # as 0.1.0.
      - name: Tag must match the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version — move the tag or bump the version"
            exit 1
          fi
          echo "OK: $GITHUB_REF_NAME matches version $version"

      # napari users install the plugin rather than the app, so the release carries the
      # wheel too. Seconds to build, and it keeps the README's install instructions true.
      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -lh dist/

      - uses: actions/download-artifact@v4
        with:
          path: assets      # one subfolder per platform artifact

      - name: What is being released
        run: find assets dist -type f | sort

      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          ### Which file do I want?

          | your machine | download |
          |---|---|
          | Mac, Apple Silicon (M1–M4) | `…-macos-arm64.zip` |
          | Mac, Intel | `…-macos-x86_64.zip` |
          | Windows | `…-windows-x64.zip` |
          | Linux | `…-linux-x64.tar.gz` |
          | you already use napari | the `.whl` — `pip install <it>` |

          Unzip and double-click. Nothing else to install: Python, Qt and napari are inside.

          **First launch.** The app is not signed, so the system asks once.
          On macOS use **right-click ▸ Open** instead of a double-click (and if there is no
          *Open* button, run
          `xattr -dr com.apple.quarantine "/Applications/Multiplex Thresholder.app"`).
          On Windows choose **More info ▸ Run anyway**.
          Keep the unzipped Windows and Linux folders together — the executable needs its
          siblings.

          Every archive here was built by this run and started successfully on its own
          platform before being uploaded.
          EOF
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Multiplex Thresholder ${{ github.ref_name }}
          body_path: notes.md
          generate_release_notes: true    # appends the commit log to the notes above
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}   # v0.2.0-rc1 -> pre-release
          fail_on_unmatched_files: true
          files: |
            assets/**/*.zip
            assets/**/*.tar.gz
            dist/*.whl
            dist/*.tar.gz
