# Build and test the distribution. Manual only — this never starts by itself.
#
# GitHub webpage ▸ Actions ▸ "Build and test wheel" ▸ Run workflow: choose the branch
# **or tag** to build, choose how much of the matrix to run, press the green button.
# There is no push, pull-request or schedule trigger, so nothing is spent unless it is
# asked for.
#
# It builds the sdist and the wheel once, then installs *that wheel* on the chosen
# platforms and runs the headless test suite there. Both artefacts are attached to the
# run, so a release candidate can be downloaded and installed by hand.
#
# It publishes nothing — no GitHub Release, no PyPI upload. Run it against a `v*` tag and
# one extra check applies: the tag must agree with the version in pyproject.toml.
#
# The "Run workflow" button only appears once this file is on the repository's default
# branch. Until then the workflow is not listed at all.
name: Build and test wheel

run-name: Build ${{ github.ref_name }} (${{ inputs.scope }} matrix)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Platforms to install the built wheel on"
        type: choice
        default: full
        options:
          - full     # Ubuntu + Windows + macOS, Python 3.11, 3.12 and 3.13
          - quick    # Ubuntu, Python 3.13 only — a fast check while iterating

# A second run on the same ref supersedes an in-flight one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Windows runners default to PowerShell; one shell everywhere keeps the steps below
    # identical across the matrix.
    shell: bash

jobs:
  build:
    name: sdist + wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      wheel: ${{ steps.meta.outputs.wheel }}
      matrix: ${{ steps.matrix.outputs.json }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the floor, so the build is checked at its oldest

      # The `scope` input, defaulting to the full matrix if it is somehow absent. Read
      # through the environment rather than interpolated into the script, so the value
      # can never be shell.
      - id: matrix
        name: Decide the test matrix
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          scope = os.environ.get("SCOPE") or "full"
          if scope == "quick":
              combos = [{"os": "ubuntu-latest", "python-version": "3.13"}]
          else:
              combos = [
                  {"os": os_, "python-version": py}
                  for os_ in ("ubuntu-latest", "windows-latest", "macos-latest")
                  for py in ("3.11", "3.12", "3.13")
              ]
          print("json=" + json.dumps(combos))
          print(f"{scope}: {len(combos)} combination(s)", file=__import__("sys").stderr)
          PY

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build
        run: python -m build            # -> dist/*.whl and dist/*.tar.gz

      - name: Check metadata
        run: twine check dist/*

      - id: meta
        name: Read version and wheel name
        run: |
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          wheel=$(basename dist/*.whl)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
          echo "version $version, wheel $wheel"

      # The npe2 manifest is loaded by package-relative name through the
      # `napari.manifest` entry point. If it is missing from the wheel, the plugin
      # installs cleanly and then never appears in napari's Plugins menu — which is a
      # silent failure, so it is asserted on the built artefact itself.
      - name: Manifest must be inside the wheel
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          target = "napari_multiplex_thresholder/napari.yaml"
          print("\n".join(sorted(names)))
          if target not in names:
              sys.exit(f"{target} is not in {wheel} — check [tool.setuptools.package-data]")
          print(f"OK: {target} ships in {wheel}")
          PY

      # Pure Python, no compiled extensions: one wheel has to cover every platform.
      - name: Wheel must be pure-Python
        run: |
          case "$(basename dist/*.whl)" in
            *-py3-none-any.whl) echo "OK: universal wheel" ;;
            *) echo "::error::not a py3-none-any wheel: $(basename dist/*.whl)"; exit 1 ;;
          esac

      # Only when the run was dispatched against a `v*` tag (the Run workflow dropdown
      # lists tags as well as branches). A mismatch means the release would be labelled
      # with a version the package does not report.
      - name: Tag must match the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version ${{ steps.meta.outputs.version }}"
            exit 1
          fi
          echo "OK: tag $GITHUB_REF_NAME matches version $tag"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4      # for tests/, not for the package under test

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # The wheel, not the checkout: this is what a user gets, and it proves the
      # dependencies resolve to binary wheels on all three platforms. Deliberately
      # without the `app` extra, so no Qt binding is installed — the point is that the
      # non-GUI half works on a machine with no display.
      - name: Install the built wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dist/${{ needs.build.outputs.wheel }}"

      - name: Import without a Qt binding
        run: |
          python -c "
          import napari_multiplex_thresholder as m
          print('version', m.__version__)
          from napari_multiplex_thresholder import _core, _lazy
          print('core and lazy import with no Qt present')
          "

      # Same check napari's plugin discovery does, against the installed distribution.
      - name: Manifest is discoverable
        run: |
          python -c "
          from npe2 import PluginManifest
          mf = PluginManifest.from_distribution('napari-multiplex-thresholder')
          assert mf.name == 'napari-multiplex-thresholder', mf.name
          widgets = [w.display_name for w in mf.contributions.widgets]
          cmd = mf.contributions.commands[0].python_name
          print(mf.name, '|', mf.display_name, '|', widgets, '|', cmd)
          assert widgets == ['Multiplex Thresholder'], widgets
          # A class contribution, never a factory function: napari injects the viewer
          # only into classes, and calls a function contribution with no arguments.
          assert cmd.endswith(':GatingControls'), cmd
          "

      # Synthetic fixtures, no Qt, no napari viewer, no display. Runs as a script so it
      # also works in an analysis environment that has no pytest.
      - name: Core tests
        run: python tests/test_core.py

  # tests/test_widget_real_data.py is not run here: it needs a real OpenGL context and
  # real tiles, neither of which a runner has. It stays a local gate (README, "Tests").
  summary:
    name: build ok
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - env:
          VERSION: ${{ needs.build.outputs.version }}
          WHEEL: ${{ needs.build.outputs.wheel }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### napari-multiplex-thresholder $VERSION

          \`$WHEEL\` built and checked, then installed and tested on every platform in
          the **${{ inputs.scope }}** matrix.
          Download it from this run's **Artifacts ▸ dist**.
          EOF
